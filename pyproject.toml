[project]
name = "pdf-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "docling>=2.0,<3", "sentence-transformers>=5,<6",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1", "pymupdf>=1.25,<2",
  "httpx>=0.28,<1", "kagglehub>=0.3,<1", "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
